[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "AI-powered GitHub code review bot with AST analysis and multi-pass LLM reasoning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "chandraprakash" }]
dependencies = [
    "anthropic==0.79.0",
    "openai==2.20.0",
    "PyGithub==2.8.1",
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "pydantic==2.12.5",
    "PyYAML==6.0.3",
    "unidiff==0.7.5",
]

[project.optional-dependencies]
dashboard = ["streamlit==1.54.0"]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.0",
]

[project.scripts]
ai-review = "src.main:main"

[tool.setuptools]
packages = ["src", "src.reviewers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
